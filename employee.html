<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Employee Portal — DocuCloud</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif} [x-cloak]{display:none!important}
.gradient-bg{background:var(--theme-gradient,linear-gradient(135deg,#667eea 0%,#764ba2 100%))}
.glass{backdrop-filter:blur(12px);background:rgba(255,255,255,.9)}
.dark .glass{background:rgba(15,23,42,.9)}
.file-card{transition:all .2s ease} .file-card:hover{transform:translateY(-3px)}
.scrollbar-hide::-webkit-scrollbar{display:none}
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 transition-colors" x-data="employeeApp()" x-init="init()">

<!-- TOAST -->
<div x-show="toast.show" x-transition class="fixed bottom-5 right-5 z-[100] px-4 py-3 rounded-xl shadow-lg bg-white dark:bg-slate-800 border-l-4 flex items-center gap-3" :class="toast.type==='success'?'border-green-500':'border-blue-500'">
  <i :data-lucide="toast.icon" class="w-5 h-5" :class="toast.type==='success'?'text-green-500':'text-blue-500'"></i>
  <span class="text-sm font-semibold" x-text="toast.message"></span>
</div>

<!-- LOGIN / REGISTER OVERLAY -->
<div x-show="!isLoggedIn" class="fixed inset-0 z-50 flex items-center justify-center p-4 gradient-bg">
  <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-8 fade-in">
    <div class="text-center mb-6">
      <div class="w-16 h-16 mx-auto rounded-2xl gradient-bg flex items-center justify-center text-white mb-3">
        <i data-lucide="users" class="w-8 h-8"></i>
      </div>
      <h2 class="text-2xl font-extrabold">Employee Portal</h2>
      <p class="text-sm text-slate-500 mt-1">Akses Dokumen Perusahaan</p>
    </div>

    <!-- Tabs -->
    <div class="flex bg-slate-100 dark:bg-slate-800 rounded-lg p-1 mb-6">
      <button @click="showRegister=false" class="flex-1 py-2 text-sm font-bold rounded-md transition" :class="!showRegister ? 'bg-white dark:bg-slate-700 shadow text-indigo-600' : 'text-slate-500'">Login</button>
      <button @click="showRegister=true" class="flex-1 py-2 text-sm font-bold rounded-md transition" :class="showRegister ? 'bg-white dark:bg-slate-700 shadow text-indigo-600' : 'text-slate-500'">Daftar</button>
    </div>

    <!-- Login Form -->
    <div x-show="!showRegister">
      <input x-model="loginUsername" type="text" placeholder="Username" class="w-full px-4 py-3 rounded-lg bg-slate-100 dark:bg-slate-800 mb-3 outline-none focus:ring-2 focus:ring-indigo-500">
      <input x-model="loginPassword" type="password" placeholder="Password" class="w-full px-4 py-3 rounded-lg bg-slate-100 dark:bg-slate-800 mb-4 outline-none focus:ring-2 focus:ring-indigo-500">
      <p x-show="loginError" class="text-red-500 text-xs mb-3" x-text="loginError"></p>
      <button @click="login()" class="w-full py-3 rounded-lg gradient-bg text-white font-bold shadow-lg hover:opacity-90 transition">Masuk</button>
    </div>

    <!-- Register Form -->
    <div x-show="showRegister">
      <input x-model="regName" type="text" placeholder="Nama Lengkap" class="w-full px-4 py-3 rounded-lg bg-slate-100 dark:bg-slate-800 mb-3 outline-none">
      <input x-model="regUsername" type="text" placeholder="Username" class="w-full px-4 py-3 rounded-lg bg-slate-100 dark:bg-slate-800 mb-3 outline-none">
      <input x-model="regEmail" type="email" placeholder="Email" class="w-full px-4 py-3 rounded-lg bg-slate-100 dark:bg-slate-800 mb-3 outline-none">
      <input x-model="regDepartment" type="text" placeholder="Departemen (Opsional)" class="w-full px-4 py-3 rounded-lg bg-slate-100 dark:bg-slate-800 mb-3 outline-none">
      <input x-model="regPassword" type="password" placeholder="Password (Min 6 char)" class="w-full px-4 py-3 rounded-lg bg-slate-100 dark:bg-slate-800 mb-4 outline-none">
      <p x-show="regError" class="text-red-500 text-xs mb-3" x-text="regError"></p>
      <button @click="register()" class="w-full py-3 rounded-lg gradient-bg text-white font-bold shadow-lg hover:opacity-90 transition">Daftar Sekarang</button>
      <p class="text-[10px] text-center text-slate-400 mt-3">Akun akan aktif setelah disetujui Admin.</p>
    </div>
  </div>
</div>

<!-- MAIN APP (Hanya muncul jika login & approved) -->
<div x-show="isLoggedIn && currentUser.status === 'approved'" class="min-h-screen flex flex-col md:flex-row">
  
  <!-- Sidebar -->
  <aside class="w-full md:w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex-shrink-0 hidden md:flex flex-col">
    <div class="h-16 flex items-center gap-3 px-6 border-b border-slate-200 dark:border-slate-800">
      <div class="w-8 h-8 rounded-lg gradient-bg flex items-center justify-center text-white"><i data-lucide="cloud" class="w-4 h-4"></i></div>
      <span class="font-extrabold text-sm">DocuCloud Employee</span>
    </div>
    <nav class="p-4 space-y-1 flex-1">
      <button @click="activeMenu='dashboard'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold transition" :class="activeMenu==='dashboard' ? 'bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600' : 'hover:bg-slate-100 dark:hover:bg-slate-800'">
        <i data-lucide="layout-grid" class="w-4 h-4"></i> Dashboard
      </button>
      <button @click="activeMenu='bookmarks'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold transition" :class="activeMenu==='bookmarks' ? 'bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600' : 'hover:bg-slate-100 dark:hover:bg-slate-800'">
        <i data-lucide="bookmark" class="w-4 h-4"></i> Bookmark
      </button>
    </nav>
    <div class="p-4 border-t border-slate-200 dark:border-slate-800">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center font-bold text-xs" x-text="currentUser.name.charAt(0)"></div>
        <div class="min-w-0">
          <p class="text-xs font-bold truncate" x-text="currentUser.name"></p>
          <p class="text-[10px] text-slate-500 truncate" x-text="currentUser.department || 'Staff'"></p>
        </div>
      </div>
      <button @click="logout()" class="w-full py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold hover:bg-red-50 hover:text-red-500 transition">Keluar</button>
    </div>
  </aside>

  <!-- Content -->
  <main class="flex-1 p-4 md:p-8">
    <!-- Header -->
    <header class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-extrabold" x-text="activeMenu==='dashboard' ? 'Dokumen Saya' : 'Bookmark'"></h1>
        <p class="text-sm text-slate-500 mt-1">Hak Akses: <span class="font-bold text-indigo-500" x-text="currentUser.access === 'all' ? 'Semua Kategori' : 'Terbatas (' + currentUser.access + ')'"></span></p>
      </div>
      <div class="relative w-64">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input x-model="searchQuery" type="text" placeholder="Cari dokumen..." class="w-full pl-9 pr-4 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
    </header>

    <!-- Filter Kategori -->
    <div class="flex gap-2 mb-6 overflow-x-auto pb-2 scrollbar-hide">
      <button @click="filterCategory=''" class="px-4 py-1.5 rounded-full text-xs font-bold transition" :class="!filterCategory ? 'gradient-bg text-white' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800'">Semua</button>
      <template x-for="cat in categories" :key="cat.name">
        <button @click="filterCategory=cat.name" class="px-4 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap" :class="filterCategory===cat.name ? 'gradient-bg text-white' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800'" x-text="cat.name"></button>
      </template>
    </div>

    <!-- File Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      <template x-for="file in (activeMenu==='dashboard' ? filteredFiles : bookmarkedFiles)" :key="file.id">
        <div class="file-card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 relative group cursor-pointer" @click="downloadFile(file)">
          <div class="flex items-start justify-between mb-3">
            <div class="w-10 h-10 rounded-lg flex items-center justify-center" :style="'background:'+file.color+'15'">
              <i :data-lucide="file.icon" class="w-5 h-5" :style="'color:'+file.color"></i>
            </div>
            <button @click.stop="toggleBookmark(file.id)" class="text-slate-400 hover:text-yellow-500 transition">
              <i data-lucide="bookmark" :class="isBookmarked(file.id) ? 'fill-yellow-500 text-yellow-500' : ''" class="w-4 h-4"></i>
            </button>
          </div>
          <h3 class="text-sm font-bold truncate mb-1" x-text="file.name"></h3>
          <div class="flex items-center gap-2 text-[10px] text-slate-500">
            <span x-text="file.size"></span>
            <span>•</span>
            <span x-text="file.date"></span>
          </div>
          <!-- Tags AI (Jika ada) -->
          <div x-show="file.tags && file.tags.length > 0" class="flex flex-wrap gap-1 mt-3">
            <template x-for="tag in (file.tags || [])" :key="tag">
              <span class="px-1.5 py-0.5 rounded text-[8px] font-bold text-white" :style="'background:#'+Math.floor(Math.random()*16777215).toString(16)" x-text="tag"></span>
            </template>
          </div>
        </div>
      </template>
    </div>
    
    <div x-show="(activeMenu==='dashboard' ? filteredFiles : bookmarkedFiles).length === 0" class="text-center py-20">
      <i data-lucide="inbox" class="w-12 h-12 mx-auto text-slate-300 mb-3"></i>
      <p class="text-sm text-slate-500">Tidak ada dokumen ditemukan.</p>
      <p class="text-xs text-slate-400 mt-2">Pastikan admin sudah mengupload file di Dashboard Utama.</p>
    </div>
  </main>
</div>

<!-- SCRIPT SINKRONISASI -->
<script>
function employeeApp() {
  return {
    showRegister: false, isLoggedIn: false, activeMenu: 'dashboard', searchQuery: '', filterCategory: '',
    loginUsername: '', loginPassword: '', loginError: '',
    regName: '', regUsername: '', regEmail: '', regPassword: '', regDepartment: '', regError: '',
    toast: { show: false, message: '', type: 'success', icon: 'check-circle' },
    currentUser: null, files: [], categories: [], bookmarks: [],

    // ★ FILTER LOGIC: Cek Hak Akses User
    get filteredFiles() {
      return this.files.filter(f => {
        const matchSearch = !this.searchQuery || f.name.toLowerCase().includes(this.searchQuery.toLowerCase());
        const matchCat = !this.filterCategory || f.category === this.filterCategory;
        
        // Cek Hak Akses: Jika user hanya punya akses terbatas, sembunyikan file di luar kategorinya
        let hasAccess = true;
        if (this.currentUser && this.currentUser.access && this.currentUser.access !== 'all') {
          const allowedCats = this.currentUser.access.split(',').map(s => s.trim());
          hasAccess = allowedCats.includes(f.category);
        }
        
        return matchSearch && matchCat && hasAccess;
      });
    },
    get bookmarkedFiles() { return this.files.filter(f => this.bookmarks.includes(f.id)); },

    init() {
      this.loadCategories();
      this.loadFiles();
      this.checkSession();
      
      // Auto-sync setiap 5 detik
      setInterval(() => { 
        this.loadFiles(); 
        this.loadCategories(); 
        if(this.isLoggedIn) this.refreshCurrentUser();
      }, 5000); 
      
      this.$nextTick(() => lucide.createIcons());
    },

    loadCategories() {
      // Membaca kategori yang dibuat di index.html
      const saved = localStorage.getItem('dc_categories');
      this.categories = saved ? JSON.parse(saved) : [];
    },
    
    // ★ MENGAMBIL DATA DARI INDEX.HTML (Multi-source check)
    loadFiles() {
      // Coba baca dari dc_metadata_cache (format baru index.html)
      let saved = localStorage.getItem('dc_metadata_cache');
      
      // Fallback ke dc_documents (format lama) jika cache belum ada
      if (!saved) {
        saved = localStorage.getItem('dc_documents');
      }
      
      if (saved) {
        try {
          this.files = JSON.parse(saved);
        } catch(e) {
          console.error('Gagal parse data file:', e);
          this.files = [];
        }
      } else {
        this.files = [];
      }
    },

    refreshCurrentUser() {
      if(!this.currentUser) return;
      const users = JSON.parse(localStorage.getItem('dc_users') || '[]');
      const u = users.find(x => x.id === this.currentUser?.id);
      if (u) this.currentUser = u;
    },

    checkSession() {
      const sessionId = localStorage.getItem('dc_employee_session');
      if (sessionId) {
        const users = JSON.parse(localStorage.getItem('dc_users') || '[]');
        const u = users.find(x => x.id === sessionId);
        if (u && u.status === 'approved') {
          this.currentUser = u;
          this.isLoggedIn = true;
          this.loadBookmarks();
        } else {
          localStorage.removeItem('dc_employee_session');
        }
      }
    },

    loadBookmarks() {
      if (!this.currentUser) return;
      const saved = localStorage.getItem('dc_bookmarks_' + this.currentUser.username);
      this.bookmarks = saved ? JSON.parse(saved) : [];
    },
    saveBookmarks() {
      if (!this.currentUser) return;
      localStorage.setItem('dc_bookmarks_' + this.currentUser.username, JSON.stringify(this.bookmarks));
    },
    isBookmarked(id) { return this.bookmarks.includes(id); },
    toggleBookmark(id) {
      const idx = this.bookmarks.indexOf(id);
      if (idx === -1) { this.bookmarks.push(id); this.showToast('Disimpan ke bookmark'); }
      else { this.bookmarks.splice(idx, 1); this.showToast('Dihapus dari bookmark', 'info'); }
      this.saveBookmarks();
    },
    downloadFile(file) {
      window.open(`https://drive.google.com/file/d/${file.id}/view`, '_blank');
      this.showToast('Membuka: ' + file.name);
    },

    login() {
      this.loginError = '';
      const users = JSON.parse(localStorage.getItem('dc_users') || '[]');
      const u = users.find(x => x.username === this.loginUsername && x.password === this.loginPassword);
      if (!u) { this.loginError = 'Username atau password salah'; return; }
      if (u.status !== 'approved') { this.loginError = 'Akun belum disetujui Admin.'; return; }
      
      this.currentUser = u;
      this.isLoggedIn = true;
      localStorage.setItem('dc_employee_session', u.id);
      this.loadBookmarks();
      this.showToast('Selamat datang, ' + u.name);
    },

    register() {
      this.regError = '';
      if (!this.regName || !this.regUsername || !this.regPassword) { this.regError = 'Data wajib diisi'; return; }
      const users = JSON.parse(localStorage.getItem('dc_users') || '[]');
      if (users.some(x => x.username === this.regUsername)) { this.regError = 'Username sudah dipakai'; return; }
      
      const newUser = {
        id: 'user_' + Date.now(), name: this.regName, username: this.regUsername, 
        email: this.regEmail, password: this.regPassword, department: this.regDepartment,
        status: 'pending', access: 'all', registeredAt: new Date().toISOString()
      };
      users.push(newUser);
      localStorage.setItem('dc_users', JSON.stringify(users));
      
      this.currentUser = newUser;
      this.isLoggedIn = true; // Masuk sebagai pending user
      this.showToast('Pendaftaran berhasil! Menunggu approval.', 'info');
      this.showRegister = false;
    },

    logout() {
      localStorage.removeItem('dc_employee_session');
      this.currentUser = null; this.isLoggedIn = false;
      this.showToast('Anda telah keluar', 'info');
    },

    showToast(msg, type='success') {
      this.toast = {show:true, message:msg, type, icon: type==='success'?'check-circle':'info'};
      setTimeout(() => this.toast.show = false, 3000);
    },
  }
}
</script>
</body>
</html>
