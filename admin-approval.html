<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Approval Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif} [x-cloak]{display:none!important}
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200" x-data="adminApproval()" x-init="init()">

<div class="max-w-5xl mx-auto p-6">
  <header class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-2xl font-extrabold">Admin Approval Center</h1>
      <p class="text-sm text-slate-500">Kelola pendaftaran karyawan & hak akses</p>
    </div>
    <div class="flex gap-3">
      <button @click="loadUsers()" class="px-4 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm font-bold flex items-center gap-2">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh Data
      </button>
      <a href="index.html" target="_blank" class="px-4 py-2 rounded-lg gradient-bg text-white text-sm font-bold flex items-center gap-2">
        <i data-lucide="external-link" class="w-4 h-4"></i> Buka Dashboard Utama
      </a>
    </div>
  </header>

  <!-- Stats -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
    <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
      <p class="text-xs font-bold text-slate-500 uppercase">Total Pendaftar</p>
      <p class="text-2xl font-extrabold mt-1" x-text="users.length"></p>
    </div>
    <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
      <p class="text-xs font-bold text-yellow-500 uppercase">Menunggu Persetujuan</p>
      <p class="text-2xl font-extrabold mt-1" x-text="users.filter(u=>u.status==='pending').length"></p>
    </div>
    <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
      <p class="text-xs font-bold text-green-500 uppercase">User Aktif</p>
      <p class="text-2xl font-extrabold mt-1" x-text="users.filter(u=>u.status==='approved').length"></p>
    </div>
  </div>

  <!-- Tabel User -->
  <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
    <table class="w-full text-sm text-left">
      <thead class="bg-slate-50 dark:bg-slate-800 text-xs uppercase font-bold text-slate-500">
        <tr>
          <th class="px-6 py-4">Nama / Username</th>
          <th class="px-6 py-4">Departemen</th>
          <th class="px-6 py-4">Status</th>
          <th class="px-6 py-4">Hak Akses Kategori</th>
          <th class="px-6 py-4 text-right">Aksi</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
        <template x-for="u in users" :key="u.id">
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
            <td class="px-6 py-4">
              <p class="font-bold" x-text="u.name"></p>
              <p class="text-xs text-slate-500" x-text="u.username"></p>
            </td>
            <td class="px-6 py-4 text-slate-500" x-text="u.department || '-'"></td>
            <td class="px-6 py-4">
              <span class="px-2 py-1 rounded text-[10px] font-bold" 
                    :class="u.status==='approved' ? 'bg-green-100 text-green-700' : u.status==='rejected' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'"
                    x-text="u.status.toUpperCase()"></span>
            </td>
            <td class="px-6 py-4">
              <select x-model="u.access" @change="saveUserAccess(u)" class="bg-slate-100 dark:bg-slate-800 border-0 rounded text-xs p-1.5 outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="all">Semua Kategori</option>
                <template x-for="cat in categories" :key="cat.name">
                  <option :value="cat.name" x-text="cat.name"></option>
                </template>
              </select>
            </td>
            <td class="px-6 py-4 text-right">
              <div class="flex items-center justify-end gap-2">
                <button x-show="u.status==='pending'" @click="approveUser(u)" class="p-2 rounded-lg bg-green-50 text-green-600 hover:bg-green-100 transition" title="Setujui">
                  <i data-lucide="check" class="w-4 h-4"></i>
                </button>
                <button x-show="u.status==='pending'" @click="rejectUser(u)" class="p-2 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition" title="Tolak">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
                <button @click="deleteUser(u)" class="p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition" title="Hapus Permanen">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
    <div x-show="users.length===0" class="p-8 text-center text-slate-500">Belum ada data pendaftar.</div>
  </div>
</div>

<script>
function adminApproval() {
  return {
    users: [], categories: [],
    
    init() {
      this.loadUsers();
      this.loadCategories();
      setInterval(() => { this.loadUsers(); }, 5000); // Auto-refresh
      this.$nextTick(() => lucide.createIcons());
    },

    loadUsers() {
      this.users = JSON.parse(localStorage.getItem('dc_users') || '[]');
    },
    
    loadCategories() {
      // Membaca kategori dari index.html
      const saved = localStorage.getItem('dc_categories');
      this.categories = saved ? JSON.parse(saved) : [];
    },

    approveUser(u) {
      if(!confirm('Setujui akun ' + u.name + '?')) return;
      u.status = 'approved';
      this.saveUsers();
      this.showToast('User disetujui!', 'success');
    },

    rejectUser(u) {
      if(!confirm('Tolak akun ' + u.name + '?')) return;
      u.status = 'rejected';
      this.saveUsers();
      this.showToast('User ditolak', 'info');
    },

    deleteUser(u) {
      if(!confirm('Hapus permanen user ' + u.name + '?')) return;
      this.users = this.users.filter(x => x.id !== u.id);
      this.saveUsers();
      this.showToast('User dihapus', 'error');
    },

    saveUserAccess(u) {
      // Menyimpan perubahan hak akses ke localStorage
      this.saveUsers();
      this.showToast('Hak akses ' + u.name + ' diperbarui', 'success');
    },

    saveUsers() {
      localStorage.setItem('dc_users', JSON.stringify(this.users));
    },

    showToast(msg, type) {
      alert(msg); // Sederhana dulu, bisa diganti toast custom
    }
  }
}
</script>
</body>
</html>
